# ARC Training Configuration for MemGen - Recursive Memory Mode
# TRM-style recursive compression with Low-rank layers

model:
  # Base LLM - Qwen3-8B for efficient training
  model_name: Qwen/Qwen3-8B
  load_model_path: null
  load_weaver_path: null   # path to recursive_memory checkpoint

  # Augmentation settings
  max_prompt_aug_num: 1      # Single augmentation at prompt end
  max_inference_aug_num: 5   # Multiple augmentations during generation

  # Recursive Memory mode (WeaverStyleCompressor with LTPO confidence)
  recursive_memory:
    enabled: true
    weaver_style: true
    hidden_size: 4096        # Must match LLM hidden_size
    num_heads: 8
    attn_rank: 64            # Low-rank for attention
    mlp_rank: 128            # Low-rank for MLP
    max_cycles: 10           # Maximum cycles (training runs all, eval can early stop)
    confidence_threshold: -1.0  # Disabled during training (set >0 at eval for early stop)
    top_k: 10

  # Weaver configs (still needed for query_latents)
  weaver:
    model_name: Qwen/Qwen3-8B
    prompt_latents_len: 8
    inference_latents_len: 8

    # LoRA not used in recursive_memory mode, but config required
    lora_config:
      r: 32
      lora_alpha: 64
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      lora_dropout: 0.05
      bias: "none"
      task_type: "CAUSAL_LM"

  # Trigger configs (disabled)
  trigger:
    model_name: Qwen/Qwen3-8B
    active: false
    lora_config: null

# Dataset configs
dataset:
  name: arc
  data_path: /home/jovyan/MemGenWorkspace/_shared/MemGen_reproduce/data/arc-prize-2024
  mode: sft
  sft:
    val_ratio: 0.1

# Training configs
run:
  seed: 42

  # LTPO configs (optional test-time optimization)
  ltpo:
    enabled: false
    lr: 0.03
    sigma: 0.1
    max_steps: 10
    top_k: 10

  # Training mode
  mode: train
  train_weaver: true
  train_weaver_method: sft
  train_trigger: false
  output_dir: ./outputs/arc_recursive_memory

  # Weaver training configs
  weaver:
    sft:
      num_train_epochs: 3
      per_device_train_batch_size: 2
      per_device_eval_batch_size: 2
      gradient_accumulation_steps: 4

      optim: adamw_torch
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      learning_rate: 1e-4      # Higher LR for small parameter count (~8M)

      logging_strategy: steps
      logging_steps: 10
      eval_strategy: epoch
      save_strategy: "no"

      max_length: 2048
      remove_unused_columns: false
      load_best_model_at_end: false
      bf16: true
      report_to:
        - wandb

  # Evaluation interaction config
  interaction:
    max_turns: 1
    max_start_length: 2048
    max_prompt_length: 4096
    max_response_length: 512
    max_obs_length: 256
    do_sample: false
    temperature: 0.0
    batch_size: 4
